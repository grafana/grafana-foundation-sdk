# yaml-language-server: $schema=https://raw.githubusercontent.com/grafana/cog/main/schemas/compiler_passes.json

passes:
  # Add a few useful constants
  - add_object:
      object: alertingv1beta1.ApiVersion
      as:
        kind: scalar
        scalar: { scalar_kind: string, value: "rules.alerting.grafana.app/v1beta1" }

  - add_object:
      object: alertingv1beta1.AlertRuleKind
      as:
        kind: scalar
        scalar: { scalar_kind: string, value: "AlertRule" }

  - add_object:
      object: alertingv1beta1.RecordingRuleKind
      as:
        kind: scalar
        scalar: { scalar_kind: string, value: "RecordingRule" }

  - add_object:
      object: alertingv1beta1.RuleSequenceKind
      as:
        kind: scalar
        scalar: { scalar_kind: string, value: "RuleSequence" }
