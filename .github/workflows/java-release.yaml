name: Java Release
on:
  push:
    tags: ["v*"]

env:
  DEVBOX_VERSION: '0.16.0'

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: mise exec -- make deps

      - name: Get secrets
        uses: grafana/shared-workflows/actions/get-vault-secrets@c2f1df59dba624b3fd509e5181aa8da5217120c0
        with:
          repo_secrets: |
            MAVEN_USERNAME=secrets:maven_username
            MAVEN_PASSWORD=secrets:maven_password
            GPG_PASSPHRASE=gpg:passphrase
            GPG_PUBLIC_KEY=gpg:public-key
            GPG_PRIVATE_KEY=gpg:private-key

      - name: Publish package 📦
        env:
          MAVEN_USERNAME: ${{ env.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ env.MAVEN_PASSWORD }}
          GPG_PASSPHRASE: ${{ env.GPG_PASSPHRASE }}
          GPG_PUBLIC_KEY: ${{ env.GPG_PUBLIC_KEY }}
          GPG_PRIVATE_KEY: ${{ env.GPG_PRIVATE_KEY }}
        run: |
          mise exec -C java -- gradle publishToSonatype closeAndReleaseSonatypeStagingRepository
